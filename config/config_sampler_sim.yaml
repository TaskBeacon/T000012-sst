# ============================================================================
# Sampler simulation config
# - Used by: python main.py sim --config config/config_sampler_sim.yaml
# - Scope: sampler simulation only (no qa section in this file)
# - Profile: short smoke run for sampler integration checks
# ============================================================================

# === Subject Form =======================================================
subinfo_fields:
- name: subject_id
  type: int
  constraints:
    min: 101
    max: 999
    digits: 3
- name: subname
  type: string
- name: age
  type: int
  constraints:
    min: 5
    max: 60
- name: gender
  type: choice
  choices:
  - Male
  - Female

# === Subject Mapping ====================================================
subinfo_mapping:
  subject_id: 被试号
  subname: 被试姓名(拼音)
  age: 年龄
  gender: 性别
  Male: 男
  Female: 女
  registration_failed: 注册失败。
  registration_successful: 注册成功！
  invalid_input: 字段 {field} 输入无效

# === Display / Window ===================================================
window:
  size:
  - 1920
  - 1080
  units: deg
  screen: 1
  bg_color: gray
  fullscreen: true
  monitor_width_cm: 60
  monitor_distance_cm: 72

# === Task ===============================================================
task:
  task_name: eeg_sst
  language: Chinese
  voice_name: zh-CN-YunyangNeural
  total_blocks: 1
  total_trials: 24
  trial_per_block: 24
  delta: 0.05
  conditions:
  - go_left
  - go_right
  - stop_left
  - stop_right
  key_list:
  - f
  - j
  left_key: f
  right_key: j
  seed_mode: same_across_sub
  voice_enabled: false

# === Stimuli ============================================================
stimuli:
  fixation:
    type: text
    text: +
    color: white
  go_left:
    type: shape
    vertices:
    - - 0.2
      - 0.05
    - - 0.2
      - -0.05
    - - 0.0
      - -0.05
    - - 0.0
      - -0.1
    - - -0.2
      - 0.0
    - - 0.0
      - 0.1
    - - 0.0
      - 0.05
    fillColor: white
    size: 8
    lineColor: ''
  go_right:
    type: shape
    vertices:
    - - -0.2
      - 0.05
    - - -0.2
      - -0.05
    - - 0.0
      - -0.05
    - - 0.0
      - -0.1
    - - 0.2
      - 0.0
    - - 0.0
      - 0.1
    - - 0.0
      - 0.05
    fillColor: white
    size: 8
    lineColor: ''
  stop_left:
    type: shape
    vertices:
    - - 0.2
      - 0.05
    - - 0.2
      - -0.05
    - - 0.0
      - -0.05
    - - 0.0
      - -0.1
    - - -0.2
      - 0.0
    - - 0.0
      - 0.1
    - - 0.0
      - 0.05
    fillColor: red
    size: 8
    lineColor: ''
  stop_right:
    type: shape
    vertices:
    - - -0.2
      - 0.05
    - - -0.2
      - -0.05
    - - 0.0
      - -0.05
    - - 0.0
      - -0.1
    - - 0.2
      - 0.0
    - - 0.0
      - 0.1
    - - 0.0
      - 0.05
    fillColor: red
    size: 8
    lineColor: ''
  no_response_feedback:
    type: text
    text: '【未按键】

      请在箭头出现后按键

      '
    font: SimHei
    height: 0.78
  block_break:
    type: text
    text: '【休息提示】


      第 {block_num} / {total_blocks} 部分完成。

      击中率：{go_accuracy:.2f}

      正确停止率：{stop_accuracy:.2f}


      请在充分休息后按【空格键】

      进入下一部分

      '
    color: white
    font: SimHei
    height: 0.78
  instruction_text:
    type: textbox
    text: "【停止信号任务说明】\n\n在本任务中，您将看到箭头指向左或右\n您的目标是尽快且准确地做出反应\n  - 如果箭头指向左，请用左手食指按【F】\n  - 如果箭头指向右，请用右手食指按【J】\n\n注意：在某些试次中\n\
      箭头出现后不久会出现红色箭头\n当看到红色箭头时\n请尽力抑制您的反应不要按任何按键\n\n在没有红色箭头出现时，请快速做出反应\n出现红色箭头时，请尽量不做出任何按键反应\n\n准备好后，请按【空格键】开始任务。\n"
    color: white
    font: SimHei
    alignment: center
    letterHeight: 0.78
    units: deg
    size:
    - 20
    - 5
  good_bye:
    type: textbox
    text: '任务结束


      感谢您的参与

      请按【空格键】键退出

      '
    color: white
    font: SimHei
    alignment: center
    letterHeight: 0.78

# === Timing =============================================================
timing:
  fixation_duration:
  - 0.8
  - 1
  go_duration: 1.0
  no_response_feedback_duration: 0.8

# === Triggers ===========================================================
triggers:
  map:
    exp_onset: 98
    exp_end: 99
    block_onset: 100
    block_end: 101
    fixation_onset: 1
    go_onset: 10
    go_response: 11
    go_miss: 12
    pre_stop_response: 23
    on_stop_response: 24
    post_stop_response: 25
    no_response_feedback_onset: 30
  driver:
    type: serial_url
    url: loop://
    baudrate: 115200
    timeout: 1
    prefix:
    - 1
    - 225
    - 1
    - 0
  policy:
    strict: false
  timing:
    post_delay_s: 0.001

# === Adaptive Controller (optional) =====================================
controller:
  initial_ssd: 0.25
  step: 0.05
  min_ssd: 0.05
  max_ssd: 0.5
  target_success: 0.5

# === Simulation Runtime =================================================
sim:
  output_dir: outputs/sim_sampler
  seed: 0
  participant_id: sim001
  session_id: sub-sim001_task-eeg_sst_sampler_seed0
  log_path: outputs/sim_sampler/sub-sim001_task-eeg_sst_sampler_seed0_sim_events.jsonl
  policy: warn
  default_rt_s: 0.2
  clamp_rt: false
  responder:
    type: responders.sst_sampler:SSTSamplerResponder
    kwargs:
      key_left: f
      key_right: j
      p_hit_go: 0.9
      p_fail_stop: 0.5
      rt_go_mean_s: 0.32
      rt_go_sd_s: 0.05
      rt_min_s: 0.12
